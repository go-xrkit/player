name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: workflows parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A workflow that fails to PARSE reports nothing at all: no jobs run, no
      # checks appear, and the pull request looks unexercised rather than
      # broken. This is the only lane that would notice.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  darwin:
    name: darwin (the platform playback runs on)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
      # The gate is on the PORTABLE files. Playback needs a display, a video file
      # and a pair of glasses, none of which a runner has; a total-coverage gate
      # would therefore be a number chosen to pass rather than a standard.
      - name: 100% coverage gate on the portable logic
        shell: bash
        run: |
          go tool cover -func=cover.out | grep -E '/(detect|screen|source|controls|controlbar)\.go:' > portable.txt
          cat portable.txt
          # A GATE WHOSE FILTER FINDS NOTHING HAS NOT MEASURED ANYTHING. Without
          # this, a renamed file or a moved path leaves portable.txt EMPTY -- and
          # an empty file has no line below 100%, so the gate passes and prints
          # "portable logic: 100%" having read zero functions. The number it
          # reports is the number it read, so a drop is visible before it
          # becomes a silent zero. 35 today.
          n=$(grep -c '' portable.txt || true)
          if [ "$n" -lt 20 ]; then
            echo "::error::only $n gated functions were found; there are about 35, so the filter above has stopped matching"
            exit 1
          fi
          if grep -v '100.0%' portable.txt; then
            echo "::error::the portable logic is below 100% (lines above)"; exit 1
          fi
          echo "portable logic: 100% on $n functions"

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # All six of Go's 64-bit targets. s390x is big-endian and is the
          # one that would notice a byte order assumed rather than written.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  linux:
    name: linux (portable logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.1' }
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - run: CGO_ENABLED=0 go test -count=1 ./...
